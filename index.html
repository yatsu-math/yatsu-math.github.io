<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>美しい数式ページ</title>
    <style>
        /* 💡 文字が絶対に縦に崩れないようにする最新の設定 */
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; line-height: 1.8; padding: 20px; max-width: 800px; margin: 0 auto; }
        .math { font-family: "Times New Roman", Times, serif; font-style: italic; font-size: 1.2rem; }
        
        /* 数式を真ん中に綺麗に並べる設定 */
        .math-display { display: flex; justify-content: center; align-items: center; margin: 30px 0; font-family: "Times New Roman", Times, serif; font-size: 1.4rem; }
        
        /* 分数を上下に分ける設定（横方向には崩れません） */
        .fraction { display: inline-flex; flex-direction: column; align-items: center; margin: 0 6px; }
        .numerator { border-bottom: 1.5px solid black; width: 100%; text-align: center; padding-bottom: 2px; display: inline-flex; align-items: center; justify-content: center; }
        .denominator { width: 100%; text-align: center; padding-top: 2px; }
        
        /* ルートと中身を横に並べる設定 */
        .sqrt-box { display: inline-flex; align-items: center; }
        .sqrt-symbol { font-size: 1.5rem; font-style: normal; margin-right: -1px; vertical-align: middle; }
        .sqrt-content { border-top: 1.5px solid black; padding-top: 1px; display: inline-block; }
    </style>
</head>
<body>

    <h1>KaTeXを使った数式ページ</h1>
    <p>GitHub Pagesで数式を表示するテストです。</p>

    <h2>1. 文の中にある数式（インライン表示）</h2>
    <p>アインシュタインの有名な式は <span class="math">E = mc<sup>2</sup></span> です。このように文章の中に混ぜることができます。</p>

    <h2>2. 独立した大きな数式（ディスプレイ表示）</h2>
    <p>一行を丸ごと使って大きく数式を出したいときは、以下のように書きます。</p>
    
    <div class="math-display">
        <span style="font-size: 2.2rem; margin-right: 2px; font-style: normal;">∫</span><sub>a</sub><sup>b</sup> f(x) dx = F(b) - F(a)
    </div>

    <p>二次方程式の解の公式も綺麗に出ます：</p>
    
    <div class="math-display">
        x = 
        <div class="fraction">
            <!-- 💡 分子の中身が横一列に並ぶように囲み方を修正しました -->
            <span class="numerator">
                -b ± 
                <span class="sqrt-box">
                    <span class="sqrt-symbol">√</span>
                    <span class="sqrt-content">b<sup>2</sup> - 4ac</span>
                </span>
            </span>
            <span class="denominator">2a</span>
        </div>
    </div>

</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KaTeXテストページ</title>

    <!-- KaTeXの見た目を読み込む -->
    <link rel="stylesheet" href="https://jsdelivr.net">

    <!-- KaTeXを動かす仕組みを読み込む -->
    <script defer src="https://jsdelivr.net"></script>

    <!-- 自動変換のプラグイン（設定を確実な記号に変更） -->
    <script defer src="https://jsdelivr.net"
        onload="renderMathInElement(document.body, {
            delimiters: [
                {left: '\\[', right: '\\]', display: true},
                {left: '\\(', right: '\\)', display: false}
            ]
        });"></script>
</head>
<body>

    <h1>KaTeXを使った数式ページ</h1>
    <p>GitHub Pagesで数式を表示するテストです。</p>

    <h2>1. 文の中にある数式（インライン表示）</h2>
    <p>アインシュタインの有名な式は \( E=mc^2 \) です。このように文章の中に混ぜることができます。</p>

    <h2>2. 独立した大きな数式（ディスプレイ表示）</h2>
    <p>一行を丸ごと使って大きく数式を出したいときは、以下のように書きます。</p>
    \[ \int_{a}^{b} f(x) \, dx = F(b) - F(a) \]

    <p>二次方程式の解の公式も綺麗に出ます：</p>
    \[ x = \frac{-b \pm \sqrt{b^2 - 4ac}}{2a} \]

</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KaTeXテストページ</title>

    <!-- 1. 見た目（CSS）を読み込む -->
    <link rel="stylesheet" href="https://jsdelivr.net">

    <!-- 2. 動かす仕組み（JS）を読み込む -->
    <script src="https://jsdelivr.net"></script>
</head>
<body>

    <h1>KaTeXを使った数式ページ</h1>
    <p>GitHub Pagesで数式を表示するテストです。</p>

    <h2>1. 文の中にある数式（インライン表示）</h2>
    <!-- ドルマークの代わりに class="inline-math" を使います -->
    <p>アインシュタインの有名な式は <span class="inline-math">E=mc^2</span> です。このように文章の中に混ぜることができます。</p>

    <h2>2. 独立した大きな数式（ディスプレイ表示）</h2>
    <p>一行を丸ごと使って大きく数式を出したいときは、以下のように書きます。</p>
    <div class="display-math">\int_{a}^{b} f(x) \, dx = F(b) - F(a)</div>

    <p>二次方程式の解の公式も綺麗に出ます：</p>
    <div class="display-math">x = \frac{-b \pm \sqrt{b^2 - 4ac}}{2a}</div>

    <!-- 3. 安全に数式へと一斉変換するプログラム -->
    <script>
        window.onload = function() {
            // 大きな数式を一括変換
            var displays = document.getElementsByClassName('display-math');
            for (var i = 0; i < displays.length; i++) {
                katex.render(displays[i].textContent, displays[i], { displayMode: true });
            }
            // 文章中の数式を一括変換
            var inlines = document.getElementsByClassName('inline-math');
            for (var j = 0; j < inlines.length; j++) {
                katex.render(inlines[j].textContent, inlines[j], { displayMode: false });
            }
        };
    </script>
</body>
</html>

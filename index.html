<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KaTeXテストページ</title>

    <!-- 1. 見た目を読み込む -->
    <link rel="stylesheet" href="https://jsdelivr.net">

    <!-- 2. 動かす仕組みを読み込む（deferを外して確実に読み込みます） -->
    <script src="https://jsdelivr.net"></script>
    <script src="https://jsdelivr.net"></script>
</head>
<body>

    <h1>KaTeXを使った数式ページ</h1>
    <p>GitHub Pagesで数式を表示するテストです。</p>

    <h2>1. 文の中にある数式（インライン表示）</h2>
    <p>アインシュタインの有名な式は $E=mc^2$ です。このように文章の中に混ぜることができます。</p>

    <h2>2. 独立した大きな数式（ディスプレイ表示）</h2>
    <p>一行を丸ごと使って大きく数式を出したいときは、以下のように書きます。</p>
    $$ \int_{a}^{b} f(x) \, dx = F(b) - F(a) $$

    <p>二次方程式の解の公式も綺麗に出ます：</p>
    $$ x = \frac{-b \pm \sqrt{b^2 - 4ac}}{2a} $$

    <!-- 3. 画面の文字を読み込み終わったら、絶対に数式に変換する命令 -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            renderMathInElement(document.body, {
                delimiters: [
                    {left: '$$', right: '$$', display: true},
                    {left: '$', right: '$', display: false}
                ]
            });
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KaTeX数式ページ</title>

    <!-- 1. 見た目（CSS）を読み込む -->
    <link rel="stylesheet" href="https://jsdelivr.net">

    <!-- 2. 動かす仕組み（JS）を読み込む -->
    <script src="https://jsdelivr.net"></script>
</head>
<body>

    <h1>KaTeXを使った数式ページ</h1>
    <p>GitHub Pagesで数式を表示するテストです。</p>

    <h2>1. 文の中にある数式（インライン表示）</h2>
    <p>アインシュタインの有名な式は <span id="eq1"></span> です。このように文章の中に混ぜることができます。</p>

    <h2>2. 独立した大きな数式（ディスプレイ表示）</h2>
    <p>一行を丸ごと使って大きく数式を出したいときは、以下のように書きます。</p>
    <div id="eq2"></div>

    <p>二次方程式の解の公式も綺麗に出ます：</p>
    <div id="eq3"></div>


    <!-- 💡 GitHubの自動変換に絶対に邪魔されない、安全な埋め込みプログラム -->
    <script>
        window.onload = function() {
            // 1. アインシュタインの式
            katex.render("E=mc^2", document.getElementById("eq1"), { displayMode: false });
            
            // 2. 積分
            katex.render("\\int_{a}^{b} f(x) \\, dx = F(b) - F(a)", document.getElementById("eq2"), { displayMode: true });
            
            // 3. 解の公式
            katex.render("x = \\frac{-b \\pm \\sqrt{b^2 - 4ac}}{2a}", document.getElementById("eq3"), { displayMode: true });
        };
    </script>
</body>
</html>
